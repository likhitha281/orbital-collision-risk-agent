name: Live monitor

# Runs phase 2 (real SOCRATES data + deterministic scoring + trend
# detection) on a schedule and publishes results to the dashboard.
#
# Cadence matches SOCRATES Plus's own ~10-11 hour refresh cycle (see
# src/socrates_client.py) — running more often can't produce fresher data.
#
# The SQLite observation history (data/orbital_history.db) is what makes
# trend detection possible across runs. It's cached between runs rather
# than committed to git, so the repo's history doesn't fill up with binary
# diffs every 12 hours.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  live-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore observation history
        uses: actions/cache@v4
        with:
          path: data/orbital_history.db
          key: orbital-history-${{ github.run_id }}
          restore-keys: |
            orbital-history-

      - name: Run triage (phase 2)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          python run_triage.py --max-results 100 --min-probability 1e-7 --limit 30 \
            --output reports/latest.md --db-path data/orbital_history.db

      - name: Publish to dashboard
        run: cp reports/latest.json docs/latest.json

      - name: Snapshot with timestamp
        run: |
          ts=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          cp reports/latest.md "reports/${ts}.md"

      - name: Commit updated report and dashboard data
        run: |
          git config user.name "orbital-collision-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ docs/latest.json
          git diff --cached --quiet || git commit -m "Live triage update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
