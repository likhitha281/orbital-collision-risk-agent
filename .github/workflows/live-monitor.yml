name: Live monitor

# Runs the production triage pipeline using real SOCRATES data,
# deterministic scoring, and trend detection.
#
# The workflow runs every 12 hours and can also be started manually.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore observation history
        uses: actions/cache@v4
        with:
          path: data/orbital_history.db
          key: orbital-history-${{ github.run_id }}
          restore-keys: |
            orbital-history-

      - name: Run triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports

          python run_triage.py \
            --max-results 100 \
            --min-probability 1e-7 \
            --limit 30 \
            --output reports/latest.md \
            --db-path data/orbital_history.db

      # Do not publish anything unless the generated JSON exists
      # and can be parsed successfully.
      - name: Validate generated dashboard JSON
        run: |
          test -f reports/latest.json

          python -m json.tool reports/latest.json > /dev/null

          echo "reports/latest.json is valid JSON."

      - name: Publish dashboard data
        run: |
          cp reports/latest.json docs/latest.json

          python -m json.tool docs/latest.json > /dev/null

          echo "docs/latest.json is valid JSON."

      - name: Create timestamped report snapshot
        run: |
          ts=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          cp reports/latest.md "reports/${ts}.md"

      - name: Commit updated report and dashboard data
        run: |
          git config user.name "orbital-collision-agent-bot"
          git config user.email "actions@users.noreply.github.com"

          git add reports/ docs/latest.json

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Live triage update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi