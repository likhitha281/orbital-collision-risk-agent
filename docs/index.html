<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Collision-Risk Agent — Live Dashboard</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #131a26;
    --border: #263042;
    --text: #e6ebf2;
    --text-dim: #93a1b5;
    --accent: #4da3ff;
    --high: #ff5c5c;
    --medium: #ffb84d;
    --low: #4dd08a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0; }
  .badges { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .badge {
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 28px;
    font-size: 13px; flex-wrap: wrap; gap: 10px;
  }
  .status-bar .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--low); margin-right: 8px; vertical-align: 1px;
  }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .stat .value { font-size: 24px; font-weight: 600; font-family: var(--mono); }
  .event {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  }
  .event-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .event-title { font-size: 15px; font-weight: 600; }
  .tier {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    padding: 3px 10px; border-radius: 20px; text-transform: uppercase;
    white-space: nowrap;
  }
  .tier.high { background: rgba(255,92,92,0.15); color: var(--high); }
  .tier.medium { background: rgba(255,184,77,0.15); color: var(--medium); }
  .tier.low { background: rgba(77,208,138,0.15); color: var(--low); }
  .event-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px; font-size: 13px; margin-bottom: 12px;
  }
  .event-grid .k { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .event-grid .v { font-family: var(--mono); }
  .recommendation {
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px;
    font-size: 13.5px; color: var(--text-dim);
  }
  .recommendation strong { color: var(--text); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .synthetic-note { font-size: 11px; color: var(--text-dim); font-style: italic; margin-top: 8px; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-dim); }
  footer a { color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .error { background: rgba(255,92,92,0.1); border: 1px solid rgba(255,92,92,0.3); border-radius: 10px; padding: 16px; color: var(--high); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Orbital Collision-Risk Agent</h1>
    <p class="subtitle">Live conjunction screening for tracked orbital objects — refreshed automatically every 4 hours</p>
    <div class="badges">
      <span class="badge">SGP4 propagation</span>
      <span class="badge">2D-Pc (Foster &amp; Estes, 1992)</span>
      <span class="badge">Multi-tool agent</span>
    </div>
  </header>

  <div class="status-bar" id="status-bar">
    <span><span class="dot"></span>Loading latest run...</span>
  </div>

  <div id="stats" class="stats"></div>
  <div id="events"></div>

  <footer>
    Source: <a href="https://github.com/likhitha281/orbital-collision-risk-agent" target="_blank" rel="noopener">GitHub repository</a>
    &middot; Methodology: <a href="https://github.com/likhitha281/orbital-collision-risk-agent/blob/main/docs/RESEARCH.md" target="_blank" rel="noopener">Research &amp; References</a>
    &middot; Data source: <a href="https://celestrak.org/NORAD/elements/" target="_blank" rel="noopener">Celestrak</a>
  </footer>
</div>

<script>
async function loadDashboard() {
  const statusBar = document.getElementById('status-bar');
  const statsEl = document.getElementById('stats');
  const eventsEl = document.getElementById('events');

  try {
    const res = await fetch('latest.json?_=' + Date.now());
    if (!res.ok) throw new Error('latest.json not found (status ' + res.status + ')');
    const data = await res.json();

    const generated = new Date(data.generated_at);
    const ageMinutes = Math.round((Date.now() - generated.getTime()) / 60000);
    statusBar.innerHTML = `
      <span><span class="dot"></span>Last run: ${generated.toUTCString()} (${ageMinutes} min ago)</span>
      <span style="font-family: var(--mono); color: var(--text-dim);">catalog: ${escapeHtml(data.catalog_path)}</span>
    `;

    statsEl.innerHTML = `
      <div class="stat"><div class="label">Conjunctions flagged</div><div class="value">${data.conjunctions_flagged}</div></div>
      <div class="stat"><div class="label">High risk</div><div class="value">${data.events.filter(e => e.risk_tier === 'HIGH').length}</div></div>
      <div class="stat"><div class="label">Medium risk</div><div class="value">${data.events.filter(e => e.risk_tier === 'MEDIUM').length}</div></div>
      <div class="stat"><div class="label">Low risk</div><div class="value">${data.events.filter(e => e.risk_tier === 'LOW').length}</div></div>
    `;

    if (data.events.length === 0) {
      eventsEl.innerHTML = '<div class="empty">No conjunctions found below the screening threshold in this run.</div>';
      return;
    }

    eventsEl.innerHTML = data.events.map(e => `
      <div class="event">
        <div class="event-header">
          <div class="event-title">${escapeHtml(e.object_a)} vs ${escapeHtml(e.object_b)}</div>
          <span class="tier ${e.risk_tier.toLowerCase()}">${e.risk_tier}</span>
        </div>
        <div class="event-grid">
          <div><div class="k">Miss distance</div><div class="v">${e.miss_distance_km} km</div></div>
          <div><div class="k">Probability (Pc)</div><div class="v">${e.probability_of_collision.toExponential(2)}</div></div>
          <div><div class="k">Rel. speed</div><div class="v">${e.relative_speed_km_s} km/s</div></div>
          <div><div class="k">TCA (UTC)</div><div class="v">${escapeHtml(e.time_utc)}</div></div>
        </div>
        <div class="recommendation"><strong>Recommendation</strong> (${e.recommendation_source}): ${escapeHtml(e.recommendation)}</div>
        ${e.involves_synthetic ? '<div class="synthetic-note">Involves a synthetic test object (seeded for demo/reproducibility)</div>' : ''}
      </div>
    `).join('');

  } catch (err) {
    statusBar.innerHTML = '';
    eventsEl.innerHTML = `<div class="error">Couldn't load latest.json yet: ${escapeHtml(err.message)}. This shows up automatically once the scheduled workflow has run at least once — see the README for setup.</div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadDashboard();
</script>
</body>
</html>
