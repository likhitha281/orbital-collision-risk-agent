name = "orbital-risk-chatbot"
main = "worker.js"
compatibility_date = "2024-09-01"

[vars]
ALLOWED_ORIGIN = "https://likhitha281.github.io"

# Cloudflare Workers AI binding.
# Available inside worker.js as env.AI.
#
# No Anthropic/OpenAI API key is required.
[ai]
binding = "AI"

# Optional per-IP rate limiting.
#
# Uncomment after creating a KV namespace:
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "YOUR_KV_NAMESPACE_ID"